services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mmie_carte_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - photos_storage:/var/www/storage/app/private
      - vendor_data:/var/www/vendor
      - app_data:/var/www/app
      - config_data:/var/www/config
      - routes_data:/var/www/routes
      - bootstrap_data:/var/www/bootstrap
      - resources_data:/var/www/resources
      - database_data:/var/www/database
      - public_data:/var/www/public
      - storage_data:/var/www/storage
    environment:
      - APP_NAME=MMIe Carte de Visite
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY:-base64:owf35eNOo3tn8TtXqW37s66jN71pr5wrGAk8PNhx3Dk=}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - APP_LOCALE=fr
      - APP_FALLBACK_LOCALE=fr
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-mmie_carte}
      - DB_USERNAME=${DB_USERNAME:-mmie}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - MAIL_MAILER=log
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@mmi-e.fr}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin1234!}
      - ADMIN_NAME=Administrateur MMIe
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mmie_net

  web:
    image: nginx:1.25-alpine
    container_name: mmie_carte_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mmie_net

  db:
    image: mariadb:11
    container_name: mmie_carte_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MARIADB_DATABASE: ${DB_DATABASE:-mmie_carte}
      MARIADB_USER: ${DB_USERNAME:-mmie}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mmie_net

volumes:
  db_data:
  photos_storage:
  vendor_data:
  app_data:
  config_data:
  routes_data:
  bootstrap_data:
  resources_data:
  database_data:
  public_data:
  storage_data:
    # Named volumes shadow VirtioFS bind mounts, avoiding macOS deadlocks

networks:
  mmie_net:
    driver: bridge
