services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mmie_carte_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - photos_storage:/var/www/storage/app/photos
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-mmie_carte}
      - DB_USERNAME=${DB_USERNAME:-mmie}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mmie_net

  web:
    image: nginx:1.25-alpine
    container_name: mmie_carte_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mmie_net

  db:
    image: mariadb:11
    container_name: mmie_carte_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MARIADB_DATABASE: ${DB_DATABASE:-mmie_carte}
      MARIADB_USER: ${DB_USERNAME:-mmie}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mmie_net

volumes:
  db_data:
  photos_storage:

networks:
  mmie_net:
    driver: bridge
